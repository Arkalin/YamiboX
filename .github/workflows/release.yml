# Builds an unsigned .ipa from the YamiboX scheme, publishes it as a
# GitHub Release asset, and registers the new version in app-repo.json
# (the AltStore source / in-app update feed) on main.
# Unsigned because distribution is via AltStore-style sideloading, which
# re-signs the .ipa locally at install time.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (for example, v0.7.0)"
        required: true
        default: ""
        type: string
      release_notes:
        description: "Release notes shown in-app (optional; falls back to an annotated tag message, then a generic note)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Restore annotated release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Validate release identity
        id: identity
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          PROJECT_PATH: YamiboX.xcodeproj
          SCHEME: YamiboX
          CONFIGURATION: Release
          TARGET: YamiboX
          DESTINATION: generic/platform=iOS
        run: bash scripts/validate-release-identity.sh

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve release notes
        id: notes
        env:
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail

          notes="${RELEASE_NOTES_INPUT:-}"
          if [[ -z "${notes}" && "$(git for-each-ref "refs/tags/${RELEASE_TAG}" --format='%(objecttype)')" == "tag" ]]; then
            notes="$(git tag -l --format='%(contents)' "${RELEASE_TAG}")"
          fi

          if [[ -n "${notes//[[:space:]]/}" ]]; then
            {
              echo "notes<<NOTES_EOF"
              printf '%s\n' "${notes}"
              echo "NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project YamiboX.xcodeproj \
            -scheme YamiboX \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/YamiboX.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        id: package
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/YamiboX.xcarchive/Products/Applications/YamiboX.app"
          if [[ ! -d "${app_path}" ]]; then
            echo "Archived .app not found at ${app_path}" >&2
            exit 1
          fi
          payload_dir="$RUNNER_TEMP/Payload"
          rm -rf "${payload_dir}"
          mkdir -p "${payload_dir}"
          cp -R "${app_path}" "${payload_dir}/"
          ipa_name="YamiboX_v${RELEASE_VERSION}_unsigned.ipa"
          ipa_path="$RUNNER_TEMP/${ipa_name}"
          (cd "${payload_dir}/.." && zip -r -y -q "${ipa_path}" Payload)
          echo "ipa_name=${ipa_name}" >> "$GITHUB_OUTPUT"
          echo "ipa_path=${ipa_path}" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$(stat -f%z "${ipa_path}")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.notes }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
        run: |
          set -euo pipefail
          args=(
            "${IPA_PATH}#${IPA_NAME}"
            --repo "${GITHUB_REPOSITORY}"
            --title "${RELEASE_TAG}"
            --generate-notes
            --verify-tag
          )
          if [[ -n "${NOTES}" ]]; then
            args+=(--notes "${NOTES}")
          fi
          gh release create "${RELEASE_TAG}" "${args[@]}"

      - name: Register release in app-repo.json
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.notes }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
          IPA_SIZE: ${{ steps.package.outputs.ipa_size }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          tag="${RELEASE_TAG}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${IPA_NAME}"

          # The notes are Markdown for the GitHub Release: each line ends with a
          # "(shorthash[, …] · @author[, …])" group (GitHub auto-links the SHAs and
          # the @handles) under "### 新增/变更/修复" category headings. The in-app
          # update popup (localizedDescription) is plain text, so strip that trailing
          # group and turn each "### X" heading into "【X】" before storing it.
          description="$(printf '%s\n' "${NOTES:-}" | sed -E \
            -e 's/[[:space:]]*\([0-9a-fA-F]{7,}[^)]*\)[[:space:]]*$//' \
            -e 's/^###[[:space:]]+(.*[^[:space:]])[[:space:]]*$/【\1】/')"
          if [[ -z "${description//[[:space:]]/}" ]]; then
            description="版本更新，详见 GitHub Release 说明"
          fi

          git fetch origin main
          git checkout -B main origin/main

          python3 - "${version}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${description}" "${download_url}" "${IPA_SIZE}" <<'PYEOF'
          import json
          import sys

          version, date, description, url, size = sys.argv[1:6]
          description = description.strip()
          path = "app-repo.json"

          with open(path) as f:
              data = json.load(f)

          versions = data["apps"][0]["versions"]
          versions[:] = [v for v in versions if v.get("version") != version]
          versions.insert(0, {
              "version": version,
              "date": date,
              "localizedDescription": description,
              "downloadURL": url,
              "size": int(size),
          })

          with open(path, "w") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PYEOF

          if git diff --quiet -- app-repo.json; then
            echo "app-repo.json already up to date for ${tag}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-repo.json
          git commit -m "Register ${tag} in app-repo.json"
          git push origin HEAD:main
