name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  build:

    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check architecture boundaries
      run: bash scripts/check-architecture.sh
    - name: Show toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Check Swift comment ratchet
      env:
        BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      run: |
        set -euo pipefail
        base="$BASELINE_COMMIT"
        if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
          base=HEAD
        elif ! git cat-file -e "$base^{commit}"; then
          git fetch --no-tags origin "$base"
        fi
        bash scripts/check-comments.sh check "$base"
    - name: Select iOS simulator
      run: |
        set -euo pipefail
        device_line="$(
          xcrun simctl list devices available |
          awk '
            /^-- iOS / { in_ios = 1; next }
            /^-- / { in_ios = 0 }
            in_ios && $0 ~ /^[[:space:]]+iPhone / { candidate = $0 }
            END {
              if (candidate != "") {
                print candidate
              }
            }
          '
        )"
        if [[ -z "${device_line}" ]]; then
          echo "No available iPhone simulator found" >&2
          xcrun simctl list devices available >&2
          exit 1
        fi

        udid="$(printf '%s\n' "${device_line}" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
        if [[ "${udid}" == "${device_line}" ]]; then
          echo "Failed to parse simulator UDID from: ${device_line}" >&2
          exit 1
        fi

        destination="platform=iOS Simulator,id=${udid}"
        echo "IOS_SIMULATOR_DESTINATION=${destination}" >> "${GITHUB_ENV}"
        echo "Selected simulator: ${device_line}"
        echo "Selected simulator destination: ${destination}"
    - name: Build
      run: |
        xcodebuild build \
          -project YamiboX.xcodeproj \
          -scheme YamiboX \
          -destination "${IOS_SIMULATOR_DESTINATION}" \
          CODE_SIGNING_ALLOWED=NO
